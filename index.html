
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100d20">

    <title>MARENTZE | Official Links</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ANIMIRANA POZADINA -->
    <video class="background-video" autoplay muted loop playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="background-overlay"></div>
    <div class="particles"></div>

    <!-- GLAVNI SADRŽAJ -->
    <main class="container">

        <!-- PROFIL -->
        <section class="profile">

            <div class="profile-image">
                <img src="profile.png" alt="MARENTZE profile">
            </div>

            <h1>MARENTZE</h1>

            <p class="subtitle">
                OFFICIAL SOCIAL LINKS
            </p>

            <div class="online-status">
                <span></span>
                ONLINE
            </div>

        </section>

        <!-- DRUŠTVENE MREŽE -->
        <section class="links-section">

            <h2>MY SOCIALS</h2>

            <div id="social-links" class="social-links">
                <!-- Linkovi se dodaju preko JavaScript-a -->
            </div>

        </section>

        <!-- NAJNOVIJI VIDEO -->
        <section class="video-section">

            <h2>🔥 LATEST VIDEO</h2>

            <a id="latest-video" href="#" target="_blank" rel="noopener">
                <div class="video-thumbnail">
                    <img id="video-thumbnail" src="thumbnail.jpg"
                         alt="Latest video">
                    <div class="play-button">▶</div>
                </div>

                <div class="video-info">
                    <span>WATCH MY LATEST VIDEO</span>
                    <span class="video-arrow">↗</span>
                </div>
            </a>

        </section>

        <!-- EMAIL -->
        <section class="contact-section">

            <h2>CONTACT ME</h2>

            <a id="email-link" href="#">
                ✉ <span id="email-text">Email</span>
            </a>

        </section>

        <footer>
            <p>© 2026 MARENTZE</p>
            <p>MADE WITH ❤️</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
